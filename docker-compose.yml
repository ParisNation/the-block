services:
  postgres:
    image: postgres:16
    container_name: the-block-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: theblock
      POSTGRES_PASSWORD: theblock
      POSTGRES_DB: theblock
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: